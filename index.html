<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown ⚡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #170b12;
    --bg2: #1f0f18;
    --cyan: #f3c66b;
    --magenta: #ff8fb3;
    --violet: #d1477e;
    --white: #fdf3e3;
    --grid: rgba(255,255,255,0.035);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{min-height:100%;}

  body{
    min-height:100vh;
    background: var(--bg);
    font-family: 'Space Grotesk', 'Segoe UI', Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    overflow-y:auto;
    position:relative;
    padding: 24px 16px;
  }

  /* moving grid floor */
  .grid-bg{
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 42px 42px;
    z-index:0;
    mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, black 20%, transparent 80%);
    animation: gridDrift 20s linear infinite;
  }
  @keyframes gridDrift{
    0%{ background-position: 0 0, 0 0; }
    100%{ background-position: 42px 42px, 42px 42px; }
  }

  /* neon blobs */
  .blob{
    position:fixed;
    border-radius:50%;
    filter: blur(90px);
    z-index:0;
    opacity:0.55;
  }
  .blob.b1{width:420px;height:420px;background:var(--cyan);top:-140px;left:-120px;animation: drift1 12s ease-in-out infinite;}
  .blob.b2{width:380px;height:380px;background:var(--magenta);bottom:-150px;right:-100px;animation: drift2 14s ease-in-out infinite;}
  .blob.b3{width:280px;height:280px;background:var(--violet);top:55%;left:60%;animation: drift1 16s ease-in-out infinite reverse;}

  @keyframes drift1{
    0%,100%{ transform: translate(0,0); }
    50%{ transform: translate(40px, 30px); }
  }
  @keyframes drift2{
    0%,100%{ transform: translate(0,0); }
    50%{ transform: translate(-35px, -25px); }
  }

  /* scanline sweep across whole page */
  .scanline{
    position:fixed;
    top:0; left:0; right:0;
    height:2px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity:0.5;
    z-index:1;
    animation: scan 6s linear infinite;
    box-shadow: 0 0 12px var(--cyan);
  }
  @keyframes scan{
    0%{ top:0%; opacity:0; }
    5%{ opacity:0.6; }
    50%{ top:100%; opacity:0.6; }
    55%{ opacity:0; }
    100%{ top:100%; opacity:0; }
  }

  /* floating particles */
  .spark{
    position:fixed;
    width:3px; height:3px;
    background: var(--cyan);
    border-radius:50%;
    box-shadow: 0 0 8px 2px var(--cyan);
    z-index:1;
    animation-name: floatUp;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    opacity:0;
  }
  @keyframes floatUp{
    0%{ transform: translateY(0); opacity:0; }
    10%{ opacity:0.9; }
    90%{ opacity:0.5; }
    100%{ transform: translateY(-100vh); opacity:0; }
  }

  .card{
    position:relative;
    z-index:2;
    max-width: 600px;
    width:100%;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 24px;
    padding: 46px 38px;
    text-align:center;
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow:
      0 0 0 1px rgba(243,198,107,0.06),
      0 0 60px rgba(243,198,107,0.08),
      0 0 100px rgba(255,143,179,0.06),
      inset 0 1px 0 rgba(255,255,255,0.08);
    animation: cardIn 0.9s cubic-bezier(.2,.8,.2,1) both;
  }

  /* animated gradient border ring */
  .card::before{
    content:'';
    position:absolute;
    inset:-1px;
    border-radius:24px;
    padding:1px;
    background: linear-gradient(120deg, var(--cyan), var(--violet), var(--magenta), var(--cyan));
    background-size: 300% 300%;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity:0.5;
    animation: borderFlow 6s linear infinite;
    pointer-events:none;
  }

  @keyframes borderFlow{
    0%{ background-position: 0% 50%; }
    100%{ background-position: 300% 50%; }
  }

  @keyframes cardIn{
    0%{ opacity:0; transform: translateY(24px) scale(0.97); }
    100%{ opacity:1; transform: translateY(0) scale(1); }
  }

  .tag{
    display:inline-block;
    font-family:'Orbitron', sans-serif;
    font-size: 0.68rem;
    letter-spacing: 4px;
    color: var(--cyan);
    text-transform: uppercase;
    padding: 6px 16px;
    border: 1px solid rgba(243,198,107,0.4);
    border-radius: 999px;
    margin-bottom: 22px;
    box-shadow: 0 0 16px rgba(243,198,107,0.25) inset, 0 0 12px rgba(243,198,107,0.2);
  }

  .icon-row{
    font-size: 2.6rem;
    letter-spacing: 14px;
    margin-bottom: 14px;
  }
  .icon-row span{
    display:inline-block;
    filter: drop-shadow(0 0 10px rgba(243,198,107,0.6));
    animation: bob 2.4s ease-in-out infinite;
  }
  .icon-row span:nth-child(1){ animation-delay: 0s; filter: drop-shadow(0 0 12px rgba(255,143,179,0.7)); }
  .icon-row span:nth-child(2){ animation-delay: 0.3s; filter: drop-shadow(0 0 12px rgba(209,71,126,0.7)); }
  .icon-row span:nth-child(3){ animation-delay: 0.6s; filter: drop-shadow(0 0 12px rgba(243,198,107,0.7)); }
  @keyframes bob{
    0%,100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-8px) rotate(-6deg); }
  }

  h1{
    font-family:'Orbitron', sans-serif;
    font-weight:900;
    font-size: clamp(1.5rem, 5vw, 2.4rem);
    letter-spacing: 1px;
    background: linear-gradient(90deg, var(--cyan), var(--violet) 50%, var(--magenta));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 6px;
    text-shadow: none;
  }

  .subdate{
    font-family:'Space Grotesk', sans-serif;
    color: var(--white);
    opacity:0.55;
    font-size: 0.85rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 36px;
  }

  .countdown{
    display:flex;
    justify-content:center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 32px;
  }

  .unit{
    position:relative;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 16px 10px;
    min-width: 84px;
    overflow:hidden;
  }

  .unit:nth-child(1){ box-shadow: 0 0 22px rgba(243,198,107,0.15) inset; }
  .unit:nth-child(2){ box-shadow: 0 0 22px rgba(209,71,126,0.18) inset; }
  .unit:nth-child(3){ box-shadow: 0 0 22px rgba(255,143,179,0.15) inset; }
  .unit:nth-child(4){ box-shadow: 0 0 22px rgba(243,198,107,0.15) inset; }

  .num{
    display:block;
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size: clamp(1.7rem, 5vw, 2.4rem);
    color: var(--white);
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
  }
  .unit:nth-child(1) .num{ text-shadow: 0 0 16px var(--cyan), 0 0 32px rgba(243,198,107,0.4); }
  .unit:nth-child(2) .num{ text-shadow: 0 0 16px var(--violet), 0 0 32px rgba(209,71,126,0.4); }
  .unit:nth-child(3) .num{ text-shadow: 0 0 16px var(--magenta), 0 0 32px rgba(255,143,179,0.4); }
  .unit:nth-child(4) .num{ text-shadow: 0 0 16px var(--cyan), 0 0 32px rgba(243,198,107,0.4); }

  .num.tick{ animation: tick 0.35s ease; }
  @keyframes tick{
    0%{ opacity:0.25; transform: translateY(-4px); filter: blur(2px); }
    100%{ opacity:1; transform: translateY(0); filter: blur(0); }
  }

  .label{
    display:block;
    font-family:'Space Grotesk', sans-serif;
    font-size: 0.62rem;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--white);
    opacity:0.45;
    margin-top: 8px;
  }

  .divider{
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    margin: 4px 0 26px;
  }

  .message{
    font-family:'Space Grotesk', sans-serif;
    font-weight: 400;
    color: var(--white);
    font-size: 1.08rem;
    letter-spacing: 0.3px;
    opacity: 0.9;
    line-height: 1.6;
  }

  .message .accent{
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight:600;
  }

  .pulse-dot{
    display:inline-block;
    width:6px; height:6px;
    border-radius:50%;
    background: var(--magenta);
    box-shadow: 0 0 10px var(--magenta);
    margin: 0 8px;
    animation: dotPulse 1.6s ease-in-out infinite;
    vertical-align: middle;
  }
  @keyframes dotPulse{
    0%,100%{ opacity:0.3; transform: scale(0.8); }
    50%{ opacity:1; transform: scale(1.3); }
  }

  .why-btn{
    margin-top: 18px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(243,198,107,0.4);
    color: var(--cyan);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.8rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 8px 22px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 0 12px rgba(243,198,107,0.15) inset;
  }
  .why-btn:hover{
    background: rgba(243,198,107,0.12);
    border-color: rgba(243,198,107,0.7);
    box-shadow: 0 0 18px rgba(243,198,107,0.3);
    transform: translateY(-2px);
  }

  .why-answer{
    font-family: 'Space Grotesk', sans-serif;
    font-style: italic;
    color: var(--magenta);
    font-size: 0.98rem;
    margin-top: 16px;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.5s ease, max-height 0.5s ease, margin-top 0.5s ease;
    text-shadow: 0 0 12px rgba(255,143,179,0.4);
  }
  .why-answer.show{
    opacity: 1;
    max-height: 90px;
    margin-top: 16px;
  }

  .arrived{ display:none; }
  .arrived.show{ display:block; }
  .arrived h2{
    font-family:'Orbitron', sans-serif;
    font-weight:900;
    font-size: clamp(1.5rem, 6vw, 2.3rem);
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: bigPulse 1.5s ease-in-out infinite;
  }
  @keyframes bigPulse{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.05); }
  }

  /* falling confetti */
  .confetti{
    position:fixed;
    top:-20px;
    z-index:1;
    opacity:0.85;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    pointer-events:none;
  }
  @keyframes fall{
    0%{ transform: translateY(0) rotate(0deg); opacity:0.9; }
    100%{ transform: translateY(110vh) rotate(400deg); opacity:0.7; }
  }

  @media (max-width: 480px){
    .card{ padding: 32px 18px; }
    .icon-row{ letter-spacing: 8px; font-size: 2.1rem; margin-bottom: 10px; }
    .tag{ font-size: 0.6rem; padding: 5px 12px; margin-bottom: 16px; }
    .subdate{ margin-bottom: 26px; }
    .unit{ min-width: 62px; padding: 12px 4px; border-radius: 12px; }
    .countdown{ gap: 7px; margin-bottom: 24px; }
    .num{ font-size: 1.5rem; }
    .label{ font-size: 0.56rem; letter-spacing: 1.5px; }
    .message{ font-size: 0.98rem; }
    .divider{ margin: 4px 0 20px; }
  }

  @media (max-width: 360px){
    .unit{ min-width: 54px; padding: 10px 3px; }
    .num{ font-size: 1.3rem; }
    .icon-row{ letter-spacing: 5px; font-size: 1.9rem; }
  }
</style>
</head>
<body>

  <div class="grid-bg"></div>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="scanline"></div>

  <div class="card">
    <div class="icon-row"><span>🎂</span><span>🎉</span><span>🎈</span></div>
    <span class="tag">Countdown</span>
    <h1>COUNTDOWN</h1>

    <div class="countdown" id="countdownBox">
      <div class="unit">
        <span class="num" id="days">00</span>
        <span class="label">Days</span>
      </div>
      <div class="unit">
        <span class="num" id="hours">00</span>
        <span class="label">Hours</span>
      </div>
      <div class="unit">
        <span class="num" id="minutes">00</span>
        <span class="label">Mins</span>
      </div>
      <div class="unit">
        <span class="num" id="seconds">00</span>
        <span class="label">Secs</span>
      </div>
    </div>

    <div class="divider"></div>

    <p class="message" id="mainMessage">
      We're waiting for a <span class="accent">special day</span>
      <span class="pulse-dot"></span>
    </p>

    <button class="why-btn" id="whyBtn" type="button">Why?</button>
    <p class="why-answer" id="whyAnswer">It's very confidential.<br>Are you ready for the surprise? ✨<br>A new link will send to you 😗</p>

    <div class="arrived" id="arrivedBox">
      <h2>🎂 IT'S FINALLY HERE 🎉</h2>
    </div>
  </div>

<script>
  const targetDate = new Date("2026-09-29T00:00:00");

  const daysEl = document.getElementById('days');
  const hoursEl = document.getElementById('hours');
  const minutesEl = document.getElementById('minutes');
  const secondsEl = document.getElementById('seconds');
  const countdownBox = document.getElementById('countdownBox');
  const arrivedBox = document.getElementById('arrivedBox');
  const mainMessage = document.getElementById('mainMessage');

  function pad(n){ return n.toString().padStart(2, '0'); }

  function setVal(el, val){
    const text = pad(val);
    if(el.textContent !== text){
      el.textContent = text;
      el.classList.remove('tick');
      void el.offsetWidth;
      el.classList.add('tick');
    }
  }

  function updateCountdown(){
    const now = new Date();
    const diff = targetDate - now;

    if(diff <= 0){
      countdownBox.style.display = 'none';
      mainMessage.style.display = 'none';
      arrivedBox.classList.add('show');
      return;
    }

    setVal(daysEl, Math.floor(diff / (1000*60*60*24)));
    setVal(hoursEl, Math.floor((diff / (1000*60*60)) % 24));
    setVal(minutesEl, Math.floor((diff / (1000*60)) % 60));
    setVal(secondsEl, Math.floor((diff / 1000) % 60));
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);

  // floating neon sparks rising from bottom
  function createSparks(count){
    const colors = ['#f3c66b', '#ff8fb3', '#d1477e'];
    for(let i=0;i<count;i++){
      const el = document.createElement('div');
      el.className = 'spark';
      const color = colors[Math.floor(Math.random() * colors.length)];
      el.style.background = color;
      el.style.boxShadow = `0 0 10px 2px ${color}`;
      el.style.left = Math.random() * 100 + 'vw';
      el.style.bottom = (Math.random() * -20 - 5) + 'vh';
      const size = 2 + Math.random() * 3;
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      const duration = 8 + Math.random() * 10;
      el.style.animationDuration = duration + 's';
      el.style.animationDelay = (Math.random() * duration) + 's';
      document.body.appendChild(el);
    }
  }
  createSparks(28);

  // falling neon confetti strips
  function createConfetti(count){
    const colors = ['#f3c66b', '#ff8fb3', '#d1477e', '#fdf3e3'];
    for(let i=0;i<count;i++){
      const el = document.createElement('div');
      el.className = 'confetti';
      const color = colors[Math.floor(Math.random() * colors.length)];
      const w = 5 + Math.random() * 4;
      const h = 10 + Math.random() * 8;
      el.style.width = w + 'px';
      el.style.height = h + 'px';
      el.style.background = color;
      el.style.boxShadow = `0 0 6px ${color}`;
      el.style.borderRadius = '2px';
      el.style.left = Math.random() * 100 + 'vw';
      const duration = 6 + Math.random() * 6;
      el.style.animationDuration = duration + 's';
      el.style.animationDelay = (Math.random() * duration) + 's';
      document.body.appendChild(el);
    }
  }
  createConfetti(24);

  // "Why?" reveal toggle
  const whyBtn = document.getElementById('whyBtn');
  const whyAnswer = document.getElementById('whyAnswer');
  whyBtn.addEventListener('click', function(){
    whyAnswer.classList.toggle('show');
  });
</script>

</body>
</html>
